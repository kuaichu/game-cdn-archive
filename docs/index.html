<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>异环官方 CDN 文件索引</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="game-rail" aria-label="Game selector">
        <button class="game-mark active" title="异环">NTE</button>
        <button class="game-mark muted" title="预留">+</button>
      </aside>

      <nav class="side">
        <div class="brand">
          <span class="brand-logo">N</span>
          <div>
            <strong>异环</strong>
            <small>Neverness to Everness</small>
          </div>
        </div>
        <a class="side-link" href="#home">主页</a>
        <a class="side-link active" href="#files">文件列表</a>
        <a class="side-link" href="#notes">技术说明</a>
        <a class="side-link" href="#commands">下载命令</a>
        <div class="side-foot">
          <span>官方 CDN 索引</span>
          <span>不镜像游戏文件</span>
        </div>
      </nav>

      <main class="main">
        <header class="topbar" id="home">
          <div>
            <p class="kicker">Unofficial URL Archive</p>
            <h1>异环官方 CDN 文件索引</h1>
          </div>
          <div class="top-actions">
            <button class="ghost-button" id="copyCommandBtn" type="button"></button>
          </div>
        </header>

        <section class="control-strip">
          <div class="version-picker">
            <label for="versionSelect">版本选择</label>
            <button class="select-button" id="selectButton" type="button" aria-expanded="false">
              <span id="selectedVersion">-</span>
              <span class="chevron">⌄</span>
            </button>
            <div class="version-menu" id="versionMenu" hidden></div>
          </div>
          <div class="mode-tabs" role="tablist" aria-label="File mode">
            <button class="mode-tab active" data-mode="full" type="button">完整文件</button>
            <button class="mode-tab" data-mode="patches" type="button">更新补丁</button>
            <button class="mode-tab" data-mode="reslist" type="button">清单文件</button>
          </div>
          <label class="search-box">
            <span>搜索</span>
            <input id="fileSearch" placeholder="文件名 / MD5 / URL" />
          </label>
        </section>

        <section class="stats" id="stats"></section>

        <section class="notice" id="notes">
          <strong>技术说明</strong>
          <span>页面仅保存由官方 CDN 清单解析出的 URL、校验信息与下载索引；解密流程与复现细节见仓库 README。</span>
        </section>

        <section class="file-panel" id="files">
          <div class="panel-head">
            <div>
              <p class="kicker" id="panelKicker">Files</p>
              <h2 id="panelTitle">文件列表</h2>
            </div>
            <div class="panel-tools">
              <a class="tool-button" id="urlsLink" href="#" download>URL 列表</a>
              <a class="tool-button" id="aria2Link" href="#" download>aria2</a>
              <a class="tool-button" id="jsonLink" href="#" download>JSON</a>
            </div>
          </div>
          <div class="file-list" id="fileList"></div>
        </section>

        <section class="commands" id="commands">
          <div>
            <p class="kicker">Downloader</p>
            <h2>官方 CDN 下载器命令</h2>
          </div>
          <pre><code id="commandText"></code></pre>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
