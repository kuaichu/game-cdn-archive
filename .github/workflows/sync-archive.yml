name: Update archive data

on:
  workflow_dispatch:
  schedule:
    - cron: "18 23 * * *"
    - cron: "18 4 * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ff0930c51b39f84ac55383aeb3432cf0
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Notify Telegram start
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured, skip start notification."
            exit 0
          fi

          telegram_response_description() {
            TELEGRAM_BODY="$1" python3 - <<'PY'
          import json
          import os

          body = os.environ.get("TELEGRAM_BODY", "")
          try:
              data = json.loads(body)
              text = data.get("description") or body
          except Exception:
              text = body
          print(" ".join((text or "no response body")[:500].split()))
          PY
          }

          telegram_response_ok() {
            TELEGRAM_BODY="$1" python3 - <<'PY'
          import json
          import os

          try:
              print(str(json.loads(os.environ.get("TELEGRAM_BODY", "")).get("ok")).lower())
          except Exception:
              print("unknown")
          PY
          }

          send_telegram() {
            local label="$1"
            local message="$2"
            local target_index=0
            local sent_any=false

            while IFS= read -r chat_id; do
              chat_id="${chat_id#"${chat_id%%[![:space:]]*}"}"
              chat_id="${chat_id%"${chat_id##*[![:space:]]}"}"
              if [ -z "$chat_id" ]; then
                continue
              fi

              target_index=$((target_index + 1))
              sent_any=true
              body_file="$(mktemp)"
              http_code="$(curl -sS -o "$body_file" -w "%{http_code}" -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${chat_id}" \
                --data-urlencode "text=${message}" \
                -d "disable_web_page_preview=true")"
              curl_status=$?
              body="$(cat "$body_file")"
              rm -f "$body_file"

              if [ "$curl_status" -ne 0 ]; then
                echo "::warning::Failed to send Telegram ${label} notification to target #${target_index}: curl exited with ${curl_status}."
                continue
              fi

              if ! [[ "$http_code" =~ ^[0-9]{3}$ ]] || [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
                description="$(telegram_response_description "$body")"
                echo "::warning::Failed to send Telegram ${label} notification to target #${target_index} (HTTP ${http_code}): ${description}"
                continue
              fi

              if [ "$(telegram_response_ok "$body")" != "true" ]; then
                description="$(telegram_response_description "$body")"
                echo "::warning::Telegram ${label} notification to target #${target_index} returned an unexpected response: ${description}"
              fi
            done < <(printf '%s\n' "$TELEGRAM_CHAT_ID" | tr ',;' '\n')

            if [ "$sent_any" = false ]; then
              echo "::warning::TELEGRAM_CHAT_ID did not contain a usable chat id."
            fi
          }

          case "${{ github.event_name }}" in
            schedule)
              trigger="schedule"
              ;;
            workflow_dispatch)
              trigger="manual"
              ;;
            *)
              trigger="${{ github.event_name }}"
              ;;
          esac

          message=$(cat <<EOF
          Game CDN Archive sync started
          Status: running
          Trigger: $trigger
          Repository: ${{ github.repository }}
          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )

          send_telegram start "$message"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Refresh NTE data
        run: python scripts/update_nte_static.py

      - name: Refresh HoyoFiles data
        run: python scripts/sync_hoyofiles.py

      - name: Clone Endfield upstream archive
        run: git clone --depth 1 https://github.com/daydreamer-json/ak-endfield-api-archive.git /tmp/ak-endfield-api-archive

      - name: Refresh Endfield data
        run: python scripts/import_endfield_archive.py /tmp/ak-endfield-api-archive

      - name: Refresh Wuthering Waves data
        run: python scripts/sync_wuwa.py

      - name: Refresh Arknights PC data
        run: python scripts/sync_arknights_pc.py

      - name: Refresh Android APK data
        run: python scripts/sync_android_apks.py

      - name: Check generated JavaScript
        run: node --check docs/app.js

      - name: Commit changes
        id: commit
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/app.js docs/index.html scripts/update_nte_static.py scripts/sync_hoyofiles.py scripts/import_endfield_archive.py scripts/sync_wuwa.py scripts/sync_arknights_pc.py scripts/sync_android_apks.py
          git commit -m "Auto update archive data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Check Cloudflare credentials
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured, so updated archive data cannot be deployed."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured, so updated archive data cannot be deployed."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: npx --yes wrangler pages deploy docs --project-name game-cdn-archive --branch main

      - name: Notify Telegram result
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          DATA_CHANGED: ${{ steps.commit.outputs.changed }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured, skip result notification."
            exit 0
          fi

          telegram_response_description() {
            TELEGRAM_BODY="$1" python3 - <<'PY'
          import json
          import os

          body = os.environ.get("TELEGRAM_BODY", "")
          try:
              data = json.loads(body)
              text = data.get("description") or body
          except Exception:
              text = body
          print(" ".join((text or "no response body")[:500].split()))
          PY
          }

          telegram_response_ok() {
            TELEGRAM_BODY="$1" python3 - <<'PY'
          import json
          import os

          try:
              print(str(json.loads(os.environ.get("TELEGRAM_BODY", "")).get("ok")).lower())
          except Exception:
              print("unknown")
          PY
          }

          send_telegram() {
            local label="$1"
            local message="$2"
            local target_index=0
            local sent_any=false

            while IFS= read -r chat_id; do
              chat_id="${chat_id#"${chat_id%%[![:space:]]*}"}"
              chat_id="${chat_id%"${chat_id##*[![:space:]]}"}"
              if [ -z "$chat_id" ]; then
                continue
              fi

              target_index=$((target_index + 1))
              sent_any=true
              body_file="$(mktemp)"
              http_code="$(curl -sS -o "$body_file" -w "%{http_code}" -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${chat_id}" \
                --data-urlencode "text=${message}" \
                -d "disable_web_page_preview=true")"
              curl_status=$?
              body="$(cat "$body_file")"
              rm -f "$body_file"

              if [ "$curl_status" -ne 0 ]; then
                echo "::warning::Failed to send Telegram ${label} notification to target #${target_index}: curl exited with ${curl_status}."
                continue
              fi

              if ! [[ "$http_code" =~ ^[0-9]{3}$ ]] || [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
                description="$(telegram_response_description "$body")"
                echo "::warning::Failed to send Telegram ${label} notification to target #${target_index} (HTTP ${http_code}): ${description}"
                continue
              fi

              if [ "$(telegram_response_ok "$body")" != "true" ]; then
                description="$(telegram_response_description "$body")"
                echo "::warning::Telegram ${label} notification to target #${target_index} returned an unexpected response: ${description}"
              fi
            done < <(printf '%s\n' "$TELEGRAM_CHAT_ID" | tr ',;' '\n')

            if [ "$sent_any" = false ]; then
              echo "::warning::TELEGRAM_CHAT_ID did not contain a usable chat id."
            fi
          }

          case "$DATA_CHANGED" in
            true)
              change_result="changed and committed"
              ;;
            false)
              change_result="no changes"
              ;;
            *)
              change_result="not reached"
              ;;
          esac

          message=$(cat <<EOF
          Game CDN Archive sync finished
          Status: $JOB_STATUS
          Data: $change_result
          Trigger: ${{ github.event_name }}
          Repository: ${{ github.repository }}
          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )

          send_telegram result "$message"
