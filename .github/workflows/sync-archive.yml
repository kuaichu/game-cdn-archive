name: Update archive data

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Refresh scope"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - android
          - nte
          - tof
          - p5x
          - hoyofiles
          - endfield
          - wuwa
          - wuwa-full
          - arknights
  schedule:
    - cron: "18 23 * * *"
    - cron: "18 4 * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: update-archive-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ff0930c51b39f84ac55383aeb3432cf0
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_CHANNEL_CHAT_ID: ${{ secrets.TELEGRAM_CHANNEL_CHAT_ID }}
      TELEGRAM_TRANSIENT_DELETE_AFTER_SECONDS: ${{ vars.TELEGRAM_TRANSIENT_DELETE_AFTER_SECONDS }}
      SYNC_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'all' }}

    steps:
      - name: Notify Telegram start
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured, skip start notification."
            exit 0
          fi

          telegram_response_description() {
            TELEGRAM_BODY="$1" python3 - <<'PY'
          import json
          import os

          body = os.environ.get("TELEGRAM_BODY", "")
          try:
              data = json.loads(body)
              text = data.get("description") or body
          except Exception:
              text = body
          print(" ".join((text or "no response body")[:500].split()))
          PY
          }

          telegram_response_ok() {
            TELEGRAM_BODY="$1" python3 - <<'PY'
          import json
          import os

          try:
              print(str(json.loads(os.environ.get("TELEGRAM_BODY", "")).get("ok")).lower())
          except Exception:
              print("unknown")
          PY
          }

          telegram_message_id() {
            TELEGRAM_BODY="$1" python3 - <<'PY'
          import json
          import os

          try:
              message_id = (json.loads(os.environ.get("TELEGRAM_BODY", "")).get("result") or {}).get("message_id")
          except Exception:
              message_id = None
          print(message_id or "")
          PY
          }

          telegram_migrate_to_chat_id() {
            TELEGRAM_BODY="$1" python3 - <<'PY'
          import json
          import os

          try:
              data = json.loads(os.environ.get("TELEGRAM_BODY", ""))
              migrate_to_chat_id = (data.get("parameters") or {}).get("migrate_to_chat_id")
          except Exception:
              migrate_to_chat_id = None
          print(migrate_to_chat_id or "")
          PY
          }

          delete_telegram_message() {
            local label="$1"
            local chat_id="$2"
            local message_id="$3"

            if [ -z "$chat_id" ] || [ -z "$message_id" ]; then
              return 0
            fi

            body_file="$(mktemp)"
            http_code="$(curl -sS -o "$body_file" -w "%{http_code}" -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/deleteMessage" \
              --data-urlencode "chat_id=${chat_id}" \
              --data-urlencode "message_id=${message_id}")"
            curl_status=$?
            body="$(cat "$body_file")"
            rm -f "$body_file"

            if [ "$curl_status" -ne 0 ]; then
              echo "::warning::Failed to delete Telegram ${label} notification ${message_id}: curl exited with ${curl_status}."
              return 0
            fi

            if ! [[ "$http_code" =~ ^[0-9]{3}$ ]] || [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ] || [ "$(telegram_response_ok "$body")" != "true" ]; then
              description="$(telegram_response_description "$body")"
              echo "::warning::Failed to delete Telegram ${label} notification ${message_id} (HTTP ${http_code}): ${description}"
            fi
          }

          send_telegram() {
            local label="$1"
            local message="$2"
            local delete_after_seconds="${3:-0}"
            local target_index=0
            local sent_any=false
            local delete_queue=""

            if [[ "$delete_after_seconds" =~ ^[0-9]+$ ]] && [ "$delete_after_seconds" -gt 0 ]; then
              delete_queue="$(mktemp)"
            else
              delete_after_seconds=0
            fi

            while IFS= read -r chat_id; do
              chat_id="${chat_id#"${chat_id%%[![:space:]]*}"}"
              chat_id="${chat_id%"${chat_id##*[![:space:]]}"}"
              if [ -z "$chat_id" ]; then
                continue
              fi

              target_index=$((target_index + 1))
              sent_any=true
              body_file="$(mktemp)"
              http_code="$(curl -sS -o "$body_file" -w "%{http_code}" -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${chat_id}" \
                --data-urlencode "text=${message}" \
                -d "parse_mode=HTML" \
                -d "disable_web_page_preview=true")"
              curl_status=$?
              body="$(cat "$body_file")"
              rm -f "$body_file"

              if [ "$curl_status" -ne 0 ]; then
                echo "::warning::Failed to send Telegram ${label} notification to target #${target_index}: curl exited with ${curl_status}."
                continue
              fi

              if ! [[ "$http_code" =~ ^[0-9]{3}$ ]] || [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
                migrate_chat_id="$(telegram_migrate_to_chat_id "$body")"
                if [ -n "$migrate_chat_id" ]; then
                  retry_body_file="$(mktemp)"
                  retry_http_code="$(curl -sS -o "$retry_body_file" -w "%{http_code}" -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                    --data-urlencode "chat_id=${migrate_chat_id}" \
                    --data-urlencode "text=${message}" \
                    -d "parse_mode=HTML" \
                    -d "disable_web_page_preview=true")"
                  retry_curl_status=$?
                  retry_body="$(cat "$retry_body_file")"
                  rm -f "$retry_body_file"

                  if [ "$retry_curl_status" -eq 0 ] && [[ "$retry_http_code" =~ ^[0-9]{3}$ ]] && [ "$retry_http_code" -ge 200 ] && [ "$retry_http_code" -lt 300 ] && [ "$(telegram_response_ok "$retry_body")" = "true" ]; then
                    echo "::warning::Telegram ${label} notification target #${target_index} used an old group chat ID; resent to migrated supergroup ${migrate_chat_id}. Update TELEGRAM_CHAT_ID to avoid this retry."
                    if [ -n "$delete_queue" ]; then
                      message_id="$(telegram_message_id "$retry_body")"
                      if [ -n "$message_id" ]; then
                        printf '%s\t%s\n' "$migrate_chat_id" "$message_id" >> "$delete_queue"
                      fi
                    fi
                    continue
                  fi

                  retry_description="$(telegram_response_description "$retry_body")"
                  echo "::warning::Failed to retry Telegram ${label} notification to migrated target #${target_index} (HTTP ${retry_http_code}): ${retry_description}"
                fi

                description="$(telegram_response_description "$body")"
                echo "::warning::Failed to send Telegram ${label} notification to target #${target_index} (HTTP ${http_code}): ${description}"
                continue
              fi

              if [ "$(telegram_response_ok "$body")" != "true" ]; then
                description="$(telegram_response_description "$body")"
                echo "::warning::Telegram ${label} notification to target #${target_index} returned an unexpected response: ${description}"
              elif [ -n "$delete_queue" ]; then
                message_id="$(telegram_message_id "$body")"
                if [ -n "$message_id" ]; then
                  printf '%s\t%s\n' "$chat_id" "$message_id" >> "$delete_queue"
                fi
              fi
            done < <(printf '%s\n' "$TELEGRAM_CHAT_ID" | tr ',;' '\n')

            if [ "$sent_any" = false ]; then
              echo "::warning::TELEGRAM_CHAT_ID did not contain a usable chat id."
            fi

            if [ -n "$delete_queue" ]; then
              if [ -s "$delete_queue" ]; then
                echo "Telegram ${label} notification will be deleted in ${delete_after_seconds}s."
                sleep "$delete_after_seconds"
                while IFS=$'\t' read -r sent_chat_id sent_message_id; do
                  delete_telegram_message "$label" "$sent_chat_id" "$sent_message_id"
                done < "$delete_queue"
              fi
              rm -f "$delete_queue"
            fi
          }

          case "${{ github.event_name }}" in
            schedule)
              trigger="schedule"
              ;;
            workflow_dispatch)
              trigger="manual"
              ;;
            *)
              trigger="${{ github.event_name }}"
              ;;
          esac

          project="${GITHUB_REPOSITORY#*/}"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "NOTIFY_TRIGGER=${trigger}"
            echo "NOTIFY_SCOPE=${SYNC_SCOPE:-all}"
            echo "NOTIFY_STARTED_AT=$(date +%s)"
          } >> "$GITHUB_ENV"

          if [ "$trigger" = "schedule" ]; then
            echo "Skip persistent start notification for scheduled runs; final result notification will be sent instead."
            exit 0
          fi

          message=$(cat <<EOF
          Game CDN Archive sync started
          Project: $project
          Status: running
          Trigger: $trigger
          Scope: ${SYNC_SCOPE:-all}
          Run: <a href="$run_url">#$GITHUB_RUN_ID</a>
          EOF
          )

          delete_after_seconds="${TELEGRAM_TRANSIENT_DELETE_AFTER_SECONDS:-90}"
          send_telegram start "$message" "$delete_after_seconds"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Update checkout to latest main
        run: bash scripts/gha_run_step.sh "Update checkout to latest main" git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: bash scripts/gha_run_step.sh "Install Python dependencies" pip install -r requirements.txt

      - name: Restore WuWa probe cache
        if: env.SYNC_SCOPE == 'all' || env.SYNC_SCOPE == 'wuwa' || env.SYNC_SCOPE == 'wuwa-full'
        uses: actions/cache@v4
        with:
          path: .cache/wuwa_probe_facts.json
          key: wuwa-probe-facts-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            wuwa-probe-facts-v1-${{ runner.os }}-

      - name: Refresh NTE data
        if: env.SYNC_SCOPE == 'all' || env.SYNC_SCOPE == 'nte'
        env:
          GHA_RUN_RETRIES: 2
          GHA_RUN_RETRY_DELAY: 20
        run: bash scripts/gha_run_step.sh "Refresh NTE data" python scripts/update_nte_static.py

      - name: Refresh Tower of Fantasy data
        if: env.SYNC_SCOPE == 'all' || env.SYNC_SCOPE == 'tof'
        env:
          GHA_RUN_RETRIES: 2
          GHA_RUN_RETRY_DELAY: 20
        run: bash scripts/gha_run_step.sh "Refresh Tower of Fantasy data" python scripts/update_tof_static.py

      - name: Refresh P5X data
        if: env.SYNC_SCOPE == 'all' || env.SYNC_SCOPE == 'p5x'
        env:
          GHA_RUN_RETRIES: 2
          GHA_RUN_RETRY_DELAY: 20
        run: bash scripts/gha_run_step.sh "Refresh P5X data" python scripts/update_p5x_static.py

      - name: Refresh HoyoFiles data
        if: env.SYNC_SCOPE == 'all' || env.SYNC_SCOPE == 'hoyofiles'
        env:
          GHA_RUN_RETRIES: 2
          GHA_RUN_RETRY_DELAY: 20
        run: bash scripts/gha_run_step.sh "Refresh HoyoFiles data" python scripts/sync_hoyofiles.py

      - name: Test Endfield sync contract
        if: env.SYNC_SCOPE == 'all' || env.SYNC_SCOPE == 'endfield'
        run: python scripts/test_endfield_sync.py

      - name: Clone Endfield upstream archive
        if: env.SYNC_SCOPE == 'all' || env.SYNC_SCOPE == 'endfield'
        env:
          GHA_RUN_RETRIES: 2
          GHA_RUN_RETRY_DELAY: 20
        run: bash scripts/gha_run_step.sh "Clone Endfield upstream archive" bash scripts/checkout_endfield_archive.sh /tmp/ak-endfield-api-archive

      - name: Stage Endfield data
        if: env.SYNC_SCOPE == 'all' || env.SYNC_SCOPE == 'endfield'
        run: bash scripts/gha_run_step.sh "Stage Endfield data" python scripts/import_endfield_archive.py /tmp/ak-endfield-api-archive --output docs/data/endfield/staging

      - name: Validate staged Endfield data
        if: env.SYNC_SCOPE == 'all' || env.SYNC_SCOPE == 'endfield'
        run: bash scripts/gha_run_step.sh "Validate staged Endfield data" python scripts/validate_endfield_archive.py --root docs/data/endfield/staging

      - name: Promote Endfield data
        if: env.SYNC_SCOPE == 'all' || env.SYNC_SCOPE == 'endfield'
        run: bash scripts/gha_run_step.sh "Promote Endfield data" python scripts/promote_endfield_staging.py

      - name: Clean Endfield staging data
        if: env.SYNC_SCOPE == 'all' || env.SYNC_SCOPE == 'endfield'
        shell: bash
        run: rm -rf -- docs/data/endfield/staging

      - name: Validate Endfield data
        if: env.SYNC_SCOPE == 'all' || env.SYNC_SCOPE == 'endfield'
        run: bash scripts/gha_run_step.sh "Validate Endfield data" python scripts/validate_endfield_archive.py

      - name: Refresh Wuthering Waves data
        if: env.SYNC_SCOPE == 'all' || env.SYNC_SCOPE == 'wuwa' || env.SYNC_SCOPE == 'wuwa-full'
        env:
          GHA_RUN_RETRIES: 2
          GHA_RUN_RETRY_DELAY: 20
        run: bash scripts/gha_run_step.sh "Refresh Wuthering Waves data" python scripts/sync_wuwa.py

      - name: Refresh Arknights PC data
        if: env.SYNC_SCOPE == 'all' || env.SYNC_SCOPE == 'arknights'
        env:
          GHA_RUN_RETRIES: 2
          GHA_RUN_RETRY_DELAY: 20
        run: bash scripts/gha_run_step.sh "Refresh Arknights PC data" python scripts/sync_arknights_pc.py

      - name: Validate Arknights PC data
        if: env.SYNC_SCOPE == 'all' || env.SYNC_SCOPE == 'arknights'
        run: bash scripts/gha_run_step.sh "Validate Arknights PC data" python scripts/validate_arknights_pc.py

      - name: Refresh Android APK data
        if: env.SYNC_SCOPE == 'all' || env.SYNC_SCOPE == 'android'
        env:
          GHA_RUN_RETRIES: 2
          GHA_RUN_RETRY_DELAY: 20
          ANDROID_APK_REPROBE_TTL_HOURS: 20
          ANDROID_APK_FAILED_REPROBE_TTL_HOURS: 4
        run: bash scripts/gha_run_step.sh "Refresh Android APK data" python scripts/sync_android_apks.py

      - name: Probe archived URL health
        env:
          GHA_RUN_RETRIES: 2
          GHA_RUN_RETRY_DELAY: 20
          URL_STATUS_TTL_HOURS: 72
          URL_STATUS_FAILED_TTL_HOURS: 24
          URL_STATUS_FULL_INTERVAL_HOURS: 168
          URL_STATUS_ROTATION_LIMIT: 300
          URL_STATUS_WORKERS: 24
        run: bash scripts/gha_run_step.sh "Probe archived URL health" python scripts/probe_url_status.py

      - name: Refresh WuWa probe cache
        if: env.SYNC_SCOPE == 'all' || env.SYNC_SCOPE == 'wuwa' || env.SYNC_SCOPE == 'wuwa-full'
        env:
          GHA_RUN_RETRIES: 2
          GHA_RUN_RETRY_DELAY: 20
          WUWA_CDN_PROBE_TTL_HOURS: 168
          WUWA_CDN_FAILED_REPROBE_TTL_HOURS: 24
          WUWA_CDN_GRACE_HOURS: 336
        shell: bash
        run: |
          args=()
          if [ "${SYNC_SCOPE}" = "wuwa-full" ]; then
            args+=(--all-versions)
          fi
          bash scripts/gha_run_step.sh "Refresh WuWa probe cache" python scripts/probe_wuwa_availability.py "${args[@]}"

      - name: Build availability contract
        shell: bash
        env:
          ANDROID_APK_REPROBE_TTL_HOURS: 20
          ANDROID_APK_FAILED_REPROBE_TTL_HOURS: 4
          WUWA_CDN_PROBE_TTL_HOURS: 168
          WUWA_CDN_FAILED_REPROBE_TTL_HOURS: 24
          WUWA_CDN_GRACE_HOURS: 336
        run: |
          run_for_scope() {
            local label="$1"
            local scope="$2"
            shift 2
            if [ "${SYNC_SCOPE}" = "all" ] || [ "${SYNC_SCOPE}" = "${scope}" ]; then
              bash scripts/gha_run_step.sh "${label}" "$@"
            fi
          }

          run_for_scope "Build NTE availability" nte python scripts/build_nte_availability.py
          run_for_scope "Build Tower of Fantasy availability" tof python scripts/build_tof_availability.py
          run_for_scope "Build P5X availability" p5x python scripts/build_p5x_availability.py
          run_for_scope "Build HoYo availability" hoyofiles python scripts/build_hoyo_availability.py
          run_for_scope "Build Endfield availability" endfield python scripts/build_endfield_availability.py
          if [ "${SYNC_SCOPE}" = "all" ] || [ "${SYNC_SCOPE}" = "wuwa" ] || [ "${SYNC_SCOPE}" = "wuwa-full" ]; then
            wuwa_args=(--live-probe)
            if [ "${SYNC_SCOPE}" = "wuwa-full" ]; then
              wuwa_args+=(--all-versions)
            fi
            bash scripts/gha_run_step.sh "Build WuWa availability" python scripts/build_wuwa_availability.py "${wuwa_args[@]}"
          fi
          run_for_scope "Build Arknights availability" arknights python scripts/build_arknights_availability.py
          run_for_scope "Build Android availability" android python scripts/build_android_availability.py --allow-semantic-changes

      - name: Validate availability contract
        shell: bash
        run: |
          if [ "${SYNC_SCOPE}" = "all" ] || [ "${SYNC_SCOPE}" = "hoyofiles" ]; then
            bash scripts/gha_run_step.sh "Validate HoYo split data" python scripts/validate_hoyo_split.py
          fi
          if [ "${SYNC_SCOPE}" = "all" ] || [ "${SYNC_SCOPE}" = "wuwa" ] || [ "${SYNC_SCOPE}" = "wuwa-full" ]; then
            bash scripts/gha_run_step.sh "Validate WuWa split data" python scripts/validate_wuwa_split.py
          fi
          bash scripts/gha_run_step.sh "Validate availability contract" python scripts/validate_availability.py

      - name: Refresh README coverage summary
        run: bash scripts/gha_run_step.sh "Refresh README coverage summary" python scripts/update_readme_summary.py

      - name: Check generated JavaScript
        run: bash scripts/gha_run_step.sh "Check generated JavaScript" node --check docs/app.js

      - name: Check published file sizes
        run: bash scripts/gha_run_step.sh "Check published file sizes" python scripts/check_docs_file_sizes.py

      - name: Summarize version updates
        shell: bash
        run: |
          update_summary_file="${RUNNER_TEMP}/game-cdn-version-updates.txt"
          python scripts/summarize_version_updates.py --output "$update_summary_file"
          {
            echo "VERSION_UPDATE_SUMMARY<<__GAME_CDN_VERSION_UPDATES__"
            if [ -s "$update_summary_file" ]; then
              cat "$update_summary_file"
              echo
            fi
            echo "__GAME_CDN_VERSION_UPDATES__"
          } >> "$GITHUB_ENV"

      - name: Commit changes
        id: commit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/gha_run_step.sh "Commit changes" bash scripts/commit_archive_changes.sh

      - name: Check Cloudflare credentials
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          bash scripts/gha_run_step.sh "Check Cloudflare credentials" bash -e -o pipefail -c '
            if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
              echo "::error::CLOUDFLARE_API_TOKEN is not configured, so updated archive data cannot be deployed."
              exit 1
            fi
            if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
              echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured, so updated archive data cannot be deployed."
              exit 1
            fi
          '

      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GHA_RUN_RETRIES: 2
          GHA_RUN_RETRY_DELAY: 20
        run: bash scripts/gha_run_step.sh "Deploy to Cloudflare Pages" npx --yes wrangler pages deploy docs --project-name game-cdn-archive --branch main

      - name: Notify Telegram result
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          DATA_CHANGED: ${{ steps.commit.outputs.changed }}
          SYNC_SUPERSEDED: ${{ steps.commit.outputs.superseded }}
          SYNC_RERUN_QUEUED: ${{ steps.commit.outputs.rerun_queued }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || { [ -z "$TELEGRAM_CHAT_ID" ] && [ -z "$TELEGRAM_CHANNEL_CHAT_ID" ]; }; then
            echo "Telegram secrets are not configured, skip result notification."
            exit 0
          fi

          telegram_response_description() {
            TELEGRAM_BODY="$1" python3 - <<'PY'
          import json
          import os

          body = os.environ.get("TELEGRAM_BODY", "")
          try:
              data = json.loads(body)
              text = data.get("description") or body
          except Exception:
              text = body
          print(" ".join((text or "no response body")[:500].split()))
          PY
          }

          telegram_response_ok() {
            TELEGRAM_BODY="$1" python3 - <<'PY'
          import json
          import os

          try:
              print(str(json.loads(os.environ.get("TELEGRAM_BODY", "")).get("ok")).lower())
          except Exception:
              print("unknown")
          PY
          }

          telegram_message_id() {
            TELEGRAM_BODY="$1" python3 - <<'PY'
          import json
          import os

          try:
              message_id = (json.loads(os.environ.get("TELEGRAM_BODY", "")).get("result") or {}).get("message_id")
          except Exception:
              message_id = None
          print(message_id or "")
          PY
          }

          telegram_migrate_to_chat_id() {
            TELEGRAM_BODY="$1" python3 - <<'PY'
          import json
          import os

          try:
              data = json.loads(os.environ.get("TELEGRAM_BODY", ""))
              migrate_to_chat_id = (data.get("parameters") or {}).get("migrate_to_chat_id")
          except Exception:
              migrate_to_chat_id = None
          print(migrate_to_chat_id or "")
          PY
          }

          delete_telegram_message() {
            local label="$1"
            local chat_id="$2"
            local message_id="$3"

            if [ -z "$chat_id" ] || [ -z "$message_id" ]; then
              return 0
            fi

            body_file="$(mktemp)"
            http_code="$(curl -sS -o "$body_file" -w "%{http_code}" -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/deleteMessage" \
              --data-urlencode "chat_id=${chat_id}" \
              --data-urlencode "message_id=${message_id}")"
            curl_status=$?
            body="$(cat "$body_file")"
            rm -f "$body_file"

            if [ "$curl_status" -ne 0 ]; then
              echo "::warning::Failed to delete Telegram ${label} notification ${message_id}: curl exited with ${curl_status}."
              return 0
            fi

            if ! [[ "$http_code" =~ ^[0-9]{3}$ ]] || [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ] || [ "$(telegram_response_ok "$body")" != "true" ]; then
              description="$(telegram_response_description "$body")"
              echo "::warning::Failed to delete Telegram ${label} notification ${message_id} (HTTP ${http_code}): ${description}"
            fi
          }

          send_telegram() {
            local label="$1"
            local message="$2"
            local chat_ids="$3"
            local delete_after_seconds="${4:-0}"
            local target_index=0
            local sent_any=false
            local delete_queue=""

            if [[ "$delete_after_seconds" =~ ^[0-9]+$ ]] && [ "$delete_after_seconds" -gt 0 ]; then
              delete_queue="$(mktemp)"
            else
              delete_after_seconds=0
            fi

            while IFS= read -r chat_id; do
              chat_id="${chat_id#"${chat_id%%[![:space:]]*}"}"
              chat_id="${chat_id%"${chat_id##*[![:space:]]}"}"
              if [ -z "$chat_id" ]; then
                continue
              fi

              target_index=$((target_index + 1))
              sent_any=true
              body_file="$(mktemp)"
              http_code="$(curl -sS -o "$body_file" -w "%{http_code}" -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${chat_id}" \
                --data-urlencode "text=${message}" \
                -d "parse_mode=HTML" \
                -d "disable_web_page_preview=true")"
              curl_status=$?
              body="$(cat "$body_file")"
              rm -f "$body_file"

              if [ "$curl_status" -ne 0 ]; then
                echo "::warning::Failed to send Telegram ${label} notification to target #${target_index}: curl exited with ${curl_status}."
                continue
              fi

              if ! [[ "$http_code" =~ ^[0-9]{3}$ ]] || [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
                migrate_chat_id="$(telegram_migrate_to_chat_id "$body")"
                if [ -n "$migrate_chat_id" ]; then
                  retry_body_file="$(mktemp)"
                  retry_http_code="$(curl -sS -o "$retry_body_file" -w "%{http_code}" -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                    --data-urlencode "chat_id=${migrate_chat_id}" \
                    --data-urlencode "text=${message}" \
                    -d "parse_mode=HTML" \
                    -d "disable_web_page_preview=true")"
                  retry_curl_status=$?
                  retry_body="$(cat "$retry_body_file")"
                  rm -f "$retry_body_file"

                  if [ "$retry_curl_status" -eq 0 ] && [[ "$retry_http_code" =~ ^[0-9]{3}$ ]] && [ "$retry_http_code" -ge 200 ] && [ "$retry_http_code" -lt 300 ] && [ "$(telegram_response_ok "$retry_body")" = "true" ]; then
                    echo "::warning::Telegram ${label} notification target #${target_index} used an old group chat ID; resent to migrated supergroup ${migrate_chat_id}. Update TELEGRAM_CHAT_ID to avoid this retry."
                    if [ -n "$delete_queue" ]; then
                      message_id="$(telegram_message_id "$retry_body")"
                      if [ -n "$message_id" ]; then
                        printf '%s\t%s\n' "$migrate_chat_id" "$message_id" >> "$delete_queue"
                      fi
                    fi
                    continue
                  fi

                  retry_description="$(telegram_response_description "$retry_body")"
                  echo "::warning::Failed to retry Telegram ${label} notification to migrated target #${target_index} (HTTP ${retry_http_code}): ${retry_description}"
                fi

                description="$(telegram_response_description "$body")"
                echo "::warning::Failed to send Telegram ${label} notification to target #${target_index} (HTTP ${http_code}): ${description}"
                continue
              fi

              if [ "$(telegram_response_ok "$body")" != "true" ]; then
                description="$(telegram_response_description "$body")"
                echo "::warning::Telegram ${label} notification to target #${target_index} returned an unexpected response: ${description}"
              elif [ -n "$delete_queue" ]; then
                message_id="$(telegram_message_id "$body")"
                if [ -n "$message_id" ]; then
                  printf '%s\t%s\n' "$chat_id" "$message_id" >> "$delete_queue"
                fi
              fi
            done < <(printf '%s\n' "$chat_ids" | tr ',;' '\n')

            if [ "$sent_any" = false ]; then
              echo "::warning::Telegram ${label} target list did not contain a usable chat id."
            fi

            if [ -n "$delete_queue" ]; then
              if [ -s "$delete_queue" ]; then
                echo "Telegram ${label} notification will be deleted in ${delete_after_seconds}s."
                sleep "$delete_after_seconds"
                while IFS=$'\t' read -r sent_chat_id sent_message_id; do
                  delete_telegram_message "$label" "$sent_chat_id" "$sent_message_id"
                done < "$delete_queue"
              fi
              rm -f "$delete_queue"
            fi
          }

          html_escape() {
            TEXT="$1" python3 - <<'PY'
          import html
          import os

          print(html.escape(os.environ.get("TEXT", ""), quote=False))
          PY
          }

          format_duration() {
            local total_seconds="$1"
            local minutes=$((total_seconds / 60))
            local seconds=$((total_seconds % 60))
            if [ "$minutes" -gt 0 ]; then
              printf '%dm %02ds' "$minutes" "$seconds"
            else
              printf '%ds' "$seconds"
            fi
          }

          case "${{ github.event_name }}" in
            schedule)
              trigger="schedule"
              ;;
            workflow_dispatch)
              trigger="manual"
              ;;
            *)
              trigger="${{ github.event_name }}"
              ;;
          esac
          trigger="${NOTIFY_TRIGGER:-$trigger}"
          scope="${NOTIFY_SCOPE:-${SYNC_SCOPE:-all}}"

          if [ "$SYNC_SUPERSEDED" = "true" ]; then
            if [ "$SYNC_RERUN_QUEUED" = "true" ]; then
              change_result="superseded; clean rerun queued"
            else
              change_result="superseded; no additional rerun"
            fi
          else
            case "$DATA_CHANGED" in
              true)
                change_result="changed and committed"
                ;;
              false)
                change_result="no changes"
                ;;
              *)
                change_result="not reached"
                ;;
            esac
          fi

          duration="unknown"
          if [[ "${NOTIFY_STARTED_AT:-}" =~ ^[0-9]+$ ]]; then
            now="$(date +%s)"
            duration_seconds=$((now - NOTIFY_STARTED_AT))
            if [ "$duration_seconds" -lt 0 ]; then
              duration_seconds=0
            fi
            duration="$(format_duration "$duration_seconds")"
          fi

          project="${GITHUB_REPOSITORY#*/}"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          project_html="$(html_escape "$project")"
          status_html="$(html_escape "$JOB_STATUS")"
          data_html="$(html_escape "$change_result")"
          trigger_html="$(html_escape "$trigger")"
          scope_html="$(html_escape "$scope")"
          duration_html="$(html_escape "$duration")"

          if [ "$SYNC_SUPERSEDED" = "true" ]; then
            title="Game CDN Archive sync superseded"
          elif [ "$JOB_STATUS" = "success" ]; then
            title="Game CDN Archive sync finished"
          else
            title="Game CDN Archive sync failed"
          fi

          message="$title
          Project: $project_html
          Status: $status_html
          Data: $data_html
          Trigger: $trigger_html
          Scope: $scope_html
          Duration: $duration_html"

          if [ -n "${VERSION_UPDATE_SUMMARY:-}" ]; then
            updates_html="$(html_escape "$VERSION_UPDATE_SUMMARY")"
            message="$message
          Updates:
          $updates_html"
          elif [ "$DATA_CHANGED" = "true" ]; then
            message="$message
          Updates: no game version changes detected"
          fi

          if [ "$SYNC_SUPERSEDED" = "true" ]; then
            if [ "$SYNC_RERUN_QUEUED" = "true" ]; then
              message="$message
          Note: origin/main changed during generation; exactly one clean rerun was queued."
            else
              message="$message
          Note: this automatic retry was superseded by a newer main commit; no additional run was queued."
            fi
          fi

          if [ "$JOB_STATUS" != "success" ]; then
            if [ -n "${FAILED_STEP_NAME:-}" ]; then
              failed_step_html="$(html_escape "$FAILED_STEP_NAME")"
              message="$message
          Failed step: $failed_step_html"
            fi
            if [ -n "${FAILED_STEP_EXIT_CODE:-}" ]; then
              exit_code_html="$(html_escape "$FAILED_STEP_EXIT_CODE")"
              message="$message
          Exit code: $exit_code_html"
            fi
            if [ -n "${FAILED_STEP_ERROR:-}" ]; then
              error_html="$(html_escape "$FAILED_STEP_ERROR")"
              message="$message
          Error: $error_html"
            fi
          fi

          message="$message
          Run: <a href=\"$run_url\">#$GITHUB_RUN_ID</a>"

          persistent_targets="${TELEGRAM_CHANNEL_CHAT_ID:-$TELEGRAM_CHAT_ID}"
          transient_targets="${TELEGRAM_CHAT_ID:-$TELEGRAM_CHANNEL_CHAT_ID}"
          delete_after_seconds="${TELEGRAM_TRANSIENT_DELETE_AFTER_SECONDS:-90}"
          notification_targets="$persistent_targets"
          notification_delete_after=0

          if [ "$JOB_STATUS" = "success" ] && [ -z "${VERSION_UPDATE_SUMMARY:-}" ]; then
            notification_targets="$transient_targets"
            notification_delete_after="$delete_after_seconds"
            message="$message
          Note: no game version updates detected; this temporary notice will be deleted."
          elif [ "$JOB_STATUS" != "success" ]; then
            notification_targets="$transient_targets"
          fi

          send_telegram result "$message" "$notification_targets" "$notification_delete_after"
