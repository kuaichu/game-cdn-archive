name: Deploy Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ff0930c51b39f84ac55383aeb3432cf0
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check generated JavaScript
        run: node --check docs/app.js

      - name: Check published file sizes
        run: python scripts/check_docs_file_sizes.py

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler pages deploy docs --project-name game-cdn-archive --branch main
