name: Update archive data

on:
  workflow_dispatch:
  schedule:
    - cron: "18 23 * * *"
    - cron: "18 4 * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ff0930c51b39f84ac55383aeb3432cf0
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Notify Telegram start
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured, skip start notification."
            exit 0
          fi

          case "${{ github.event_name }}" in
            schedule)
              trigger="schedule"
              ;;
            workflow_dispatch)
              trigger="manual"
              ;;
            *)
              trigger="${{ github.event_name }}"
              ;;
          esac

          message=$(cat <<EOF
          Game CDN Archive sync started
          Status: running
          Trigger: $trigger
          Repository: ${{ github.repository }}
          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )

          if ! curl -fsS -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" \
            -d "disable_web_page_preview=true"; then
            echo "::warning::Failed to send Telegram start notification."
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Refresh NTE data
        run: python scripts/update_nte_static.py

      - name: Refresh HoyoFiles data
        run: python scripts/sync_hoyofiles.py

      - name: Clone Endfield upstream archive
        run: git clone --depth 1 https://github.com/daydreamer-json/ak-endfield-api-archive.git /tmp/ak-endfield-api-archive

      - name: Refresh Endfield data
        run: python scripts/import_endfield_archive.py /tmp/ak-endfield-api-archive

      - name: Refresh Wuthering Waves data
        run: python scripts/sync_wuwa.py

      - name: Refresh Arknights PC data
        run: python scripts/sync_arknights_pc.py

      - name: Refresh Android APK data
        run: python scripts/sync_android_apks.py

      - name: Check generated JavaScript
        run: node --check docs/app.js

      - name: Commit changes
        id: commit
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/app.js docs/index.html scripts/update_nte_static.py scripts/sync_hoyofiles.py scripts/import_endfield_archive.py scripts/sync_wuwa.py scripts/sync_arknights_pc.py scripts/sync_android_apks.py
          git commit -m "Auto update archive data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Check Cloudflare credentials
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured, so updated archive data cannot be deployed."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured, so updated archive data cannot be deployed."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: npx --yes wrangler pages deploy docs --project-name game-cdn-archive --branch main

      - name: Notify Telegram result
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          DATA_CHANGED: ${{ steps.commit.outputs.changed }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured, skip result notification."
            exit 0
          fi

          case "$DATA_CHANGED" in
            true)
              change_result="changed and committed"
              ;;
            false)
              change_result="no changes"
              ;;
            *)
              change_result="not reached"
              ;;
          esac

          message=$(cat <<EOF
          Game CDN Archive sync finished
          Status: $JOB_STATUS
          Data: $change_result
          Trigger: ${{ github.event_name }}
          Repository: ${{ github.repository }}
          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )

          if ! curl -fsS -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" \
            -d "disable_web_page_preview=true"; then
            echo "::warning::Failed to send Telegram result notification."
          fi
