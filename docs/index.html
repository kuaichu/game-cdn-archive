<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>二游官方 CDN 综合归档｜Game CDN Archive</title>
    <link rel="stylesheet" href="./styles.css?v=20260705-hoyo-legacy-candidates" />
  </head>
  <body>
    <div class="app">
      <aside class="game-rail" id="gameRail" aria-label="Game selector"></aside>

      <nav class="side">
        <div class="brand">
          <span class="brand-logo" id="brandLogo">N</span>
          <div>
            <strong id="brandName">异环</strong>
            <small id="brandSub">Neverness to Everness</small>
          </div>
        </div>
        <div class="side-section">
          <span class="side-label">工作区</span>
          <a class="side-link" href="#home" data-section="home">
            <span>概览</span>
            <small>版本与统计</small>
          </a>
          <a class="side-link" href="#files" data-section="files">
            <span>文件检索</span>
            <small>列表 / 对比 / Chunk</small>
          </a>
        </div>
        <div class="side-section">
          <span class="side-label">本页锚点</span>
          <a class="side-link compact" href="#notes" data-section="notes">
            <span>数据来源</span>
          </a>
          <a class="side-link compact" href="#commands" data-section="commands">
            <span>下载命令</span>
          </a>
        </div>
        <div class="side-foot">
          <span>官方下载索引</span>
          <span>不托管游戏文件</span>
        </div>
      </nav>
      <script>
        (() => {
          const sections = ["home", "notes", "files", "commands"];
          const target = sections.includes(location.hash.slice(1)) ? location.hash.slice(1) : "home";
          document.querySelectorAll(".side-link").forEach((link) => {
            link.classList.toggle("active", link.dataset.section === target);
          });
        })();
      </script>

      <main class="main">
        <header class="topbar" id="home">
          <div>
            <p class="kicker">Unofficial URL Archive</p>
            <h1 id="pageTitle">游戏官方 CDN 文件索引</h1>
          </div>
          <div class="top-actions">
            <button class="ghost-button" id="copyCommandBtn" type="button"></button>
          </div>
        </header>

        <section class="control-strip">
          <div class="version-picker">
            <label for="versionSelect">版本选择</label>
            <button class="select-button" id="selectButton" type="button" aria-expanded="false">
              <span id="selectedVersion">-</span>
              <span class="chevron">⌄</span>
            </button>
            <div class="version-menu" id="versionMenu" hidden></div>
          </div>
          <div class="mode-tabs" id="modeTabs" role="tablist" aria-label="File mode"></div>
          <label class="search-box">
            <span>搜索</span>
            <input id="fileSearch" placeholder="文件名 / MD5 / URL" />
          </label>
        </section>

        <section class="stats" id="stats"></section>

        <section class="sync-status" id="syncStatus"></section>

        <section class="analytics" id="analytics" hidden></section>

        <section class="notice" id="notes">
          <strong>技术说明</strong>
          <span>页面仅保存由官方 CDN 清单解析出的 URL、校验信息与下载索引；解密流程与复现细节见仓库 README。</span>
        </section>

        <section class="file-panel" id="files">
          <div class="panel-head">
            <div>
              <p class="kicker" id="panelKicker">Files</p>
              <h2 id="panelTitle">文件列表</h2>
            </div>
            <div class="panel-tools">
              <a class="tool-button" id="urlsLink" href="#" download>URL 列表</a>
              <a class="tool-button" id="aria2Link" href="#" download>aria2</a>
              <a class="tool-button" id="jsonLink" href="#" download>JSON</a>
              <button class="tool-button" id="scriptButton" type="button" hidden>下载脚本</button>
            </div>
          </div>
          <div class="file-list" id="fileList"></div>
        </section>

        <section class="commands" id="commands">
          <div>
            <p class="kicker">Downloader</p>
            <h2>官方 CDN 下载器命令</h2>
          </div>
          <pre><code id="commandText"></code></pre>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js?v=20260709-bh2-android"></script>
  </body>
</html>
