name: Update archive data

on:
  workflow_dispatch:
  schedule:
    - cron: "18 20 * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ff0930c51b39f84ac55383aeb3432cf0
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Refresh NTE data
        run: python scripts/update_nte_static.py

      - name: Refresh HoyoFiles data
        run: python scripts/sync_hoyofiles.py

      - name: Clone Endfield upstream archive
        run: git clone --depth 1 https://github.com/daydreamer-json/ak-endfield-api-archive.git /tmp/ak-endfield-api-archive

      - name: Refresh Endfield data
        run: python scripts/import_endfield_archive.py /tmp/ak-endfield-api-archive

      - name: Import Wuthering Waves CN archive
        run: python scripts/import_wuwa_tomyjan_archive.py

      - name: Refresh Wuthering Waves live data
        run: python scripts/sync_wuwa.py

      - name: Refresh Android APK data
        run: python scripts/sync_android_apks.py

      - name: Refresh README coverage summary
        run: python scripts/update_readme_summary.py

      - name: Check generated JavaScript
        run: node --check docs/app.js

      - name: Commit changes
        id: commit
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/data docs/assets docs/app.js .github/workflows/update-data.yml scripts/update_nte_static.py scripts/sync_hoyofiles.py scripts/import_endfield_archive.py scripts/import_wuwa_tomyjan_archive.py scripts/sync_wuwa.py scripts/sync_android_apks.py scripts/update_readme_summary.py
          git commit -m "Auto update archive data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pages-deploy
          cp -a docs .pages-deploy
          oversized="$(find .pages-deploy -type f -size +25M -print)"
          if [ -n "$oversized" ]; then
            echo "Files over Cloudflare Pages 25 MiB limit:"
            echo "$oversized"
            exit 1
          fi
          npx --yes wrangler pages deploy .pages-deploy --project-name game-cdn-archive --branch main
