name: Deploy Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ff0930c51b39f84ac55383aeb3432cf0
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check generated JavaScript
        run: node --check docs/app.js

      - name: Check Cloudflare token access
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is empty."
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          account_id = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          checks = [
              ("token verify", "https://api.cloudflare.com/client/v4/user/tokens/verify"),
              ("account access", f"https://api.cloudflare.com/client/v4/accounts/{account_id}"),
              (
                  "pages project access",
                  f"https://api.cloudflare.com/client/v4/accounts/{account_id}/pages/projects/game-cdn-archive",
              ),
          ]

          failed = False
          for label, url in checks:
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "User-Agent": "game-cdn-archive-ci",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  payload = json.loads(exc.read().decode("utf-8"))
              ok = bool(payload.get("success"))
              print(f"{label}: {'ok' if ok else 'failed'}")
              if not ok:
                  failed = True
                  for error in payload.get("errors", []):
                      print(f"  Cloudflare error {error.get('code')}: {error.get('message')}")
          if failed:
              sys.exit(1)
          PY

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler pages deploy docs --project-name game-cdn-archive --branch main
